<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - RaidScanner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        h1 { margin: 30px 0; font-size: 2rem; }
        h1 span { color: #e94560; }
        a { color: #e94560; text-decoration: none; }
        .back { margin-bottom: 20px; display: inline-block; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        th { background: rgba(0,0,0,0.3); color: #e94560; }
        tr:hover { background: rgba(255,255,255,0.05); }
        .badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            text-transform: uppercase;
        }
        .badge.lfi { background: rgba(255, 152, 0, 0.3); color: #FF9800; }
        .badge.sqli { background: rgba(244, 67, 54, 0.3); color: #F44336; }
        .badge.xss { background: rgba(156, 39, 176, 0.3); color: #9C27B0; }
        .badge.or { background: rgba(33, 150, 243, 0.3); color: #2196F3; }
        .badge.crlf { background: rgba(76, 175, 80, 0.3); color: #4CAF50; }
        .btn {
            padding: 8px 15px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            margin-right: 5px;
        }
        .btn-html { background: #e94560; color: #fff; }
        .btn-json { background: rgba(255,255,255,0.1); color: #fff; }
        .empty { text-align: center; color: #666; padding: 40px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back">← Back to Dashboard</a>
        <h1><span>Scan</span> Reports</h1>

        <table id="reportsTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="reportsList">
                <tr><td colspan="4" class="empty">Loading reports...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        async function loadReports() {
            try {
                const response = await fetch('/api/reports');
                const data = await response.json();

                const tbody = document.getElementById('reportsList');

                if (!data.reports || data.reports.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="empty">No reports found. Run a scan to generate reports.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.reports.map(r => `
                    <tr>
                        <td>${r.name}</td>
                        <td><span class="badge ${r.type}">${r.type.toUpperCase()}</span></td>
                        <td>${new Date(r.date).toLocaleString()}</td>
                        <td>
                            <a href="/api/reports/download?path=${encodeURIComponent(r.path)}" class="btn btn-html" download="${r.name}.html">HTML</a>
                            <a href="/api/reports/download?path=${encodeURIComponent(r.path)}&format=json" class="btn btn-json" download="${r.name}.json">JSON</a>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                document.getElementById('reportsList').innerHTML =
                    '<tr><td colspan="4" class="empty">Error loading reports: ' + err.message + '</td></tr>';
            }
        }

        loadReports();
    </script>
</body>
</html>
